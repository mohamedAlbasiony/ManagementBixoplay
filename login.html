
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIXOPLAY | تسجيل الدخول</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a href="./index.html" class="auth-logo">
      <img src="./Image/company-logo.png" alt="BIXOPLAY">
    </a>

    <h1 id="loginTitle">تسجيل الدخول</h1>
    <p class="muted">ادخل بيانات حسابك للوصول إلى النظام</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password"
               autocomplete="current-password" required>
      </div>

      <button id="loginBtn" type="submit" class="btn btn-gradient btn-full">
        تسجيل الدخول
      </button>
    </form>

    <p id="authMessage" class="form-message" role="status"></p>

    <div class="auth-links">
      <a href="./forgot-password.html">نسيت كلمة المرور؟</a>
      <a href="./index.html">الصفحة الرئيسية</a>
    </div>
  </main>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
