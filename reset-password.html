
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIXOPLAY | كلمة مرور جديدة</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a href="./index.html" class="auth-logo">
      <img src="./Image/company-logo.png" alt="BIXOPLAY">
    </a>

    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="muted">افتح الصفحة من رابط الاسترجاع الذي وصلك على البريد.</p>

    <form id="resetForm">
      <div class="field">
        <label for="password">كلمة المرور الجديدة</label>
        <input id="password" type="password"
               minlength="8" autocomplete="new-password" required>
      </div>

      <div class="field">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input id="confirmPassword" type="password"
               minlength="8" autocomplete="new-password" required>
      </div>

      <button id="resetBtn" class="btn btn-gradient btn-full"
              type="submit" disabled>
        حفظ كلمة المرور
      </button>
    </form>

    <p id="message" class="form-message" role="status">
      جاري التحقق من رابط الاسترجاع...
    </p>
    <a class="back-link" href="./login.html">تسجيل الدخول</a>
  </main>

  <script type="module" src="./js/reset-password.js"></script>
</body>
</html>
