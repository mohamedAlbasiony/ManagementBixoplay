
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIXOPLAY | استرجاع كلمة المرور</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a href="./index.html" class="auth-logo">
      <img src="./Image/company-logo.png" alt="BIXOPLAY">
    </a>

    <h1>استرجاع كلمة المرور</h1>
    <p class="muted">
      اكتب البريد الإلكتروني المرتبط بحسابك.
    </p>

    <form id="forgotForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" required>
      </div>

      <button id="sendBtn" type="submit" class="btn btn-gradient btn-full">
        إرسال رابط الاسترجاع
      </button>
    </form>

    <p id="message" class="form-message" role="status"></p>
    <a class="back-link" href="./login.html">العودة لتسجيل الدخول</a>
  </main>

  <script type="module" src="./js/forgot-password.js"></script>
</body>
</html>
